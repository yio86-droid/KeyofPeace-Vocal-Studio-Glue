name: Build KeyofPeace Vocal & Studio Glue

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release

      - name: Package Artifacts
        run: |
          mkdir release_pkg
          cp -r "build/KeyofPeaceVocalStudioGlue_artefacts/Release/VST3/KeyofPeace Vocal & Studio Glue.vst3" release_pkg/
          cp "build/KeyofPeaceVocalStudioGlue_artefacts/Release/Standalone/KeyofPeace Vocal & Studio Glue.exe" release_pkg/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyofPeace-Vocal-Studio-Glue-Windows
          path: release_pkg/
